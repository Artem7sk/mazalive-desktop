name: Build MazaLive Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Mac
        run: npm run build-mac
      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: MazaLive-Mac
          path: dist/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        run: npm run build-win
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MazaLive-Windows
          path: dist/*.exe
