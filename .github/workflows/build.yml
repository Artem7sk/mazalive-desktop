name: Build Mazlive Desktop 2.0 Beta

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0-beta.1)'
        required: false

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build MazLiveKOTH mod (LOCKED SHVDN 3.6.0)
        shell: pwsh
        run: |
          # Собираем мод против закреплённого ScriptHookVDotNet3 v3.6.0.
          # BUILD-MOD.ps1 падает, если итоговый DLL требует иную версию API (защита от 3.7.0).
          powershell -ExecutionPolicy Bypass -File mod\BUILD-MOD.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "mod build failed"; exit 1 }
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (agent/rules/bridge)
        run: npm test
      - name: Build Windows EXE (NSIS)
        run: npx tsc && npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test packaged app (asar + agent ESM load + window)
        shell: pwsh
        run: |
          $asar = Join-Path "dist" "win-unpacked\resources\app.asar"
          if (-not (Test-Path $asar)) { Write-Error "app.asar not found"; exit 1 }
          Write-Host "app.asar OK"
          node_modules\.bin\electron.cmd scripts\smoke-packaged.js
          if ($LASTEXITCODE -ne 0) { Write-Error "smoke test failed"; exit 1 }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mazlive-desktop-v2-beta-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/beta.yml
            dist/alpha.yml
            dist/latest.yml
          if-no-files-found: error
      - name: Show updater metadata (beta.yml/alpha.yml)
        shell: pwsh
        run: |
          foreach ($f in @("dist\beta.yml","dist\alpha.yml","dist\latest.yml")) {
            if (Test-Path $f) { Write-Host "=== $f ==="; Get-Content $f } else { Write-Host "(нет $f)" }
          }

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npx tsc && npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mazlive-desktop-v2-beta-mac
          path: |
            dist/*.zip
            dist/*.dmg
            dist/beta-mac.yml
            dist/alpha-mac.yml
            dist/latest-mac.yml
          if-no-files-found: error
