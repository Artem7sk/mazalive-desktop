name: Build Mazlive Desktop 2.0 Beta

on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0-beta.1)'
        required: false

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build MazLiveKOTH mod (LOCKED SHVDN 3.6.0)
        shell: pwsh
        run: |
          # Собираем мод против закреплённого ScriptHookVDotNet3 v3.6.0.
          # BUILD-MOD.ps1 падает, если итоговый DLL требует иную версию API (защита от 3.7.0).
          powershell -ExecutionPolicy Bypass -File mod\BUILD-MOD.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "mod build failed"; exit 1 }
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (agent/rules/bridge/legal-about)
        run: npm test
      - name: Verify legal documents present (beta.24)
        shell: pwsh
        run: |
          $files = @("legal\LICENSE_RU.txt","legal\LICENSE_EN.txt","legal\PRIVACY_RU.md","legal\PRIVACY_EN.md")
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            $len = (Get-Item $f).Length
            if ($len -lt 500) { Write-Error "$f too small ($len bytes)"; exit 1 }
            Write-Host "OK $f ($len bytes)"
          }
          # LICENSE_RU.txt должен быть UTF-16LE с BOM (0xFF 0xFE), иначе NSIS-экран
          # лицензии покажет кириллицу как кракозябры (UTF-8 читается как ANSI).
          $bytes = [System.IO.File]::ReadAllBytes("legal\LICENSE_RU.txt")
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0xFF -or $bytes[1] -ne 0xFE) {
            Write-Error "legal\LICENSE_RU.txt must be UTF-16LE with BOM (FF FE) for the NSIS license screen"
            exit 1
          }
          Write-Host "OK LICENSE_RU.txt is UTF-16LE with BOM"
      - name: Build Windows EXE (NSIS, license screen)
        run: npx tsc && node prepare-mod-dist.mjs && npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test packaged app (asar + agent ESM load + window)
        shell: pwsh
        run: |
          $asar = Join-Path "dist" "win-unpacked\resources\app.asar"
          if (-not (Test-Path $asar)) { Write-Error "app.asar not found"; exit 1 }
          Write-Host "app.asar OK"
          node_modules\.bin\electron.cmd scripts\smoke-packaged.js
          if ($LASTEXITCODE -ne 0) { Write-Error "smoke test failed"; exit 1 }
      - name: Show installer license wiring (beta.24)
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.build.nsis) { Write-Error "nsis config missing"; exit 1 }
          if ($pkg.build.nsis.license -ne "legal/LICENSE_RU.txt") { Write-Error "nsis.license not wired"; exit 1 }
          Write-Host "nsis.license =" $pkg.build.nsis.license
          Write-Host "oneClick =" $pkg.build.nsis.oneClick
          Write-Host "languages =" ($pkg.build.nsis.installerLanguages -join ",")
          if (-not $pkg.build.files.Contains("legal/**/*")) { Write-Error "legal not packaged"; exit 1 }
          Write-Host "legal packaged: OK"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mazlive-desktop-v2-beta-win
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/beta.yml
            dist/alpha.yml
            dist/latest.yml
            legal/*.txt
            legal/*.md
          if-no-files-found: error
      - name: Show updater metadata (beta.yml/alpha.yml)
        shell: pwsh
        run: |
          foreach ($f in @("dist\beta.yml","dist\alpha.yml","dist\latest.yml")) {
            if (Test-Path $f) { Write-Host "=== $f ==="; Get-Content $f } else { Write-Host "(нет $f)" }
          }

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build MazLiveKOTH mod (LOCKED SHVDN 3.6.0)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File mod\BUILD-MOD.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "mod build failed"; exit 1 }
      - run: npm ci
      - name: Verify legal documents present (beta.24)
        run: |
          for f in legal/LICENSE_RU.txt legal/LICENSE_EN.txt legal/PRIVACY_RU.md legal/PRIVACY_EN.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
            echo "OK $f ($(wc -c < "$f") bytes)"
          done
          # LICENSE_RU.txt: BOM UTF-16LE (FF FE) — иначе NSIS-экран лицензии покажет кракозябры.
          # Сравниваем первые 2 байта побайтово (устойчиво к формату od на macOS/Linux).
          bom="$(head -c 2 legal/LICENSE_RU.txt | xxd -p)"
          [ "$bom" = "fffe" ] || { echo "LICENSE_RU.txt must be UTF-16LE with BOM (got $bom)"; exit 1; }
          echo "OK LICENSE_RU.txt is UTF-16LE with BOM"
      - run: npm test
      - run: npx tsc && node prepare-mod-dist.mjs && npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mazlive-desktop-v2-beta-mac
          path: |
            dist/*.zip
            dist/*.dmg
            dist/beta-mac.yml
            dist/alpha-mac.yml
            dist/latest-mac.yml
            legal/*.txt
            legal/*.md
          if-no-files-found: error
