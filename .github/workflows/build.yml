name: Build MazaLive Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Mac
        run: npm run build-mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mazlive-mac
          path: |
            dist/*.zip
            dist/*.dmg
            dist/latest-mac.yml

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        run: npm run build-win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # latest.yml обязателен для авто-обновления (electron-updater)
      - name: Upload installer + update manifest
        uses: actions/upload-artifact@v4
        with:
          name: Mazlive-Setup-Windows
          path: |
            dist/*.exe
            dist/*.msi
            dist/latest.yml
